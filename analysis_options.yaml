# Lints for the Dart code. `flutter analyze` must report no issues.
include: package:flutter_lints/flutter.yaml

formatter:
  page_width: 120

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - lib/src/rust/** # generated by flutter_rust_bridge_codegen
    - rust_builder/cargokit/**
    - android/**
    - ios/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_redundant_argument_values
    - avoid_void_async
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - no_adjacent_strings_in_list
    - only_throw_errors
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_single_quotes
    - sort_constructors_first
    - unawaited_futures
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - use_named_constants
